name: Frontend CI/CD

# Pull requests validate everything INCLUDING the Docker build, but publish
# nothing. Only a merge to main pushes an image.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-docker-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE_NAME: tariqsulehri/book4me_fe
  # Vite bakes env vars at `npm run build`, NOT at docker build time. Passing
  # this as a Docker build-arg does nothing — it must be set here.
  VITE_API_BASE_URL: /api/v1

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The single Definition-of-Done gate: tsc -b, oxlint, and every guard in
      # scripts/guards/ against the recorded baseline. Same command developers
      # run locally — CI and local must never diverge. This repo has no test
      # suite; do not add a `npm test` step until one exists.
      - name: Verify (typecheck + lint + guards)
        run: npm run verify

      - name: Build app
        run: npm run build

      # Dockerfile does `COPY dist ...`, but dist/ is gitignored — the docker
      # job's fresh checkout would not have it. Hand the built bundle over as
      # an artifact instead of rebuilding it inside the image.
      - name: Upload dist bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist
          retention-days: 1
          if-no-files-found: error

  # ── Pull request: prove the Dockerfile builds, publish nothing ────────────
  # No `environment:` and no registry login — a PR must never touch production
  # credentials. Its layer cache warms the publish build below.
  docker-validate:
    name: Validate Docker image (no push)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: echo "Dockerfile validated on linux/amd64 — nothing published (pull request)." >> "${GITHUB_STEP_SUMMARY}"

  # ── main: build and publish ───────────────────────────────────────────────
  docker-publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          ENV_TAG="production"
          {
            echo "env_tag=${ENV_TAG}"
            echo "sha_tag=${ENV_TAG}-${SHORT_SHA}"
            echo "tags=${IMAGE_NAME}:${ENV_TAG},${IMAGE_NAME}:${ENV_TAG}-${SHORT_SHA},${IMAGE_NAME}:latest"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          echo "Published \`${IMAGE_NAME}:${{ steps.tags.outputs.env_tag }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "Published \`${IMAGE_NAME}:${{ steps.tags.outputs.sha_tag }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "Published \`${IMAGE_NAME}:latest\`" >> "${GITHUB_STEP_SUMMARY}"
