# ─── Production frontend server ─────────────────────────────────────────────
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.
#
# Two jobs: serve the built SPA, and reverse-proxy the API so the browser only
# ever talks to one origin. That is why src/config/env.ts defaults
# VITE_API_BASE_URL to the relative path `/api/v1` — no host or port is baked
# into the bundle, so the same image runs in any environment.
# ────────────────────────────────────────────────────────────────────────────

upstream api_backend {
    # `api` is the service name in docker-compose.yml; 6000 is the port the
    # backend binds via PORT in .env. Keep these two in step.
    server api:6000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Probed by the Dockerfile HEALTHCHECK and by compose. Must not touch the
    # upstream — this reports on nginx itself, not the API.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API reverse proxy ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # The voice agent has a human waiting on the phone: fail fast and let
        # the caller hear a real error rather than dead air.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering off;
    }

    # ── Static assets ───────────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Client-side routes (/dashboard, /book/:tenant) have no file on disk, so
    # unmatched paths return index.html. It must never be cached, or browsers
    # pin a stale bundle after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Do not advertise the nginx version.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 10m;
}
